name: Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release action to run.
        required: true
        default: stage
        type: choice
        options:
          - dry-run
          - stage
          - publish
      tag:
        description: npm dist tag.
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    environment: main
    env:
      NPM_TAG: ${{ github.event.inputs.tag || 'latest' }}
      RELEASE_MODE: ${{ github.event_name == 'push' && 'stage' || github.event.inputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use latest npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        if: github.event_name == 'push'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match package version v${VERSION}."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build package
        run: pnpm build

      - name: Build Rspack example
        run: pnpm build:example:rspack

      - name: Build Rsbuild example
        run: pnpm build:example:rsbuild

      - name: Clean generated example output
        run: rm -rf example/rspack/dist example/rsbuild/dist

      - name: Pack check
        run: npm pack --dry-run

      - name: Publish dry run
        if: env.RELEASE_MODE == 'dry-run'
        run: npm publish --dry-run --access public --tag "$NPM_TAG"

      - name: Stage publish
        if: env.RELEASE_MODE == 'stage'
        run: npm stage publish --access public --tag "$NPM_TAG" --provenance

      - name: Publish
        if: env.RELEASE_MODE == 'publish'
        run: npm publish --access public --tag "$NPM_TAG"
